name = "AcousticBrainz-ng"
description = "Analyze track acoustic characteristics (moods, BPM, key, tags, ReplayGain) using Essentia"
long_description = """
Analyze track acoustic characteristics using [Essentia](https://essentia.upf.edu).

This plugin is not affiliated with the [AcousticBrainz](https://acousticbrainz.org) project.
This is not a 1:1 recreation of the AcousticBrainz schema, but will provide most of the meaningful data.

External dependencies:

- Analysis tools built on Essentia and TensorFlow, which need to be built with the included scripts (see the homepage)
- A few MusicNN models (included)
- [FFmpeg](https://ffmpeg.org)

**This plugin is CPU heavy!**
"""
