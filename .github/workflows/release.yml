# Publishes a GitHub release when a plugin version tag, e.g. v3.2.0, is pushed.
#
# Picard installs and updates the plugin from the tags themselves, the release
# adds release notes and keeps the latest plugin version, not the analysis
# tools, as the repository's latest release. See "Releasing the plugin" in the
# README.

name: Plugin release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release
        run: python3 scripts/check-release.py "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tools=$(sed -n 's/^TOOLS_RELEASE = //p' constants.py)
          # Notes since the previous plugin version, not since a tools release
          previous=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '[.[].tagName | select(startswith("v"))][0] // ""')
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "AcousticBrainz-ng ${GITHUB_REF_NAME#v}" \
            --notes "Needs the analysis tools release [tools-$tools](https://github.com/$GH_REPO/releases/tag/tools-$tools), install them with the Install tools button in the plugin options." \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"} \
            --latest
