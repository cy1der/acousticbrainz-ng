# Builds the analysis tools (extractors/) for every supported platform, and
# the GPU tools, which also include the WebGPU execution provider, for Linux and
# Windows. On macOS the tools use the GPU through CoreML.
#
# Pull requests that change the tools only build and test them. The runners
# have no GPU, the GPU tools are tested falling back to the CPU.
# Running the workflow manually with a release number also publishes them as
# the GitHub release tools-<number>, see "Releasing the analysis tools" in
# CONTRIBUTING.md.
#
# The tools are versioned separately from the plugin since they rarely change.
# Release numbers are plain integers: Picard treats tags that look like version
# numbers, e.g. tools-v1.0.0, as plugin versions when updating plugins.

name: Analysis tools

on:
  pull_request:
    paths:
      - extractors/**
      - models/*.onnx
      - scripts/build-binaries.*
      - scripts/test-binaries.py
      - scripts/reference-predictions.json
      - .github/workflows/tools.yml
  workflow_dispatch:
    inputs:
      release:
        description: Release number to publish as tools-<number>, leave empty to only build
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - name: Check the release number
        id: label
        env:
          RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$RELEASE" ]; then
            echo "label=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$RELEASE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The release number must be a positive integer, got '$RELEASE'"
            exit 1
          fi
          # Fail before spending an hour on builds
          if gh api "repos/$GH_REPO/git/ref/tags/tools-$RELEASE" >/dev/null 2>&1; then
            echo "::error::The tag tools-$RELEASE already exists"
            exit 1
          fi
          echo "label=$RELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built in the PyPA manylinux images, the binaries run on any
          # distribution with glibc 2.28 or newer
          - platform: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            gpu: true
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            gpu: true
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          # Also runs on Windows on ARM through emulation
          - platform: windows-x86_64
            runner: windows-2022
            gpu: true
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 120
    env:
      ARCHIVE: abng-tools-${{ needs.prepare.outputs.label }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/downloads
          key: tools-downloads-${{ matrix.platform }}-${{ hashFiles('scripts/build-binaries.*') }}
          restore-keys: tools-downloads-${{ matrix.platform }}-

      - name: Install nasm
        if: matrix.platform == 'linux-x86_64'
        run: dnf install -y nasm || echo "nasm isn't available, building without it"

      - name: Install nasm
        if: matrix.platform == 'macos-x86_64'
        run: brew install nasm || echo "nasm isn't available, building without it"

      - name: Build
        if: runner.os != 'Windows'
        run: scripts/build-binaries.sh

      # Building FFmpeg, which includes the ffmpeg and ffprobe programs, with
      # Visual Studio needs MSYS2
      - name: Set up Visual Studio
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: make diffutils
          pacboy: nasm:p
          path-type: inherit

      - name: Build FFmpeg
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: scripts/build-binaries.sh --ffmpeg-only

      - name: Build
        id: build-windows
        if: runner.os == 'Windows'
        # Leaves time for the next step when the build hangs
        timeout-minutes: 90
        shell: pwsh
        run: scripts/build-binaries.ps1 -FFmpeg build/prefix-windows-x86_64

      # Ninja only logs finished steps, list the slowest ones and the compiles
      # that never finished to find out where a failed build got stuck
      - name: Build timings
        if: always() && runner.os == 'Windows' && steps.build-windows.outcome != 'success' && steps.build-windows.outcome != 'skipped'
        shell: pwsh
        run: |
          $directory = 'build\build-windows-x86_64\extractors'
          $log = Join-Path $directory '.ninja_log'
          if (-not (Test-Path $log)) {
            Write-Output 'No Ninja log, the build failed before compiling the tools'
            exit 0
          }
          $finished = Get-Content $log | Where-Object { $_ -notlike '#*' } | ForEach-Object {
            $fields = $_ -split "`t"
            [pscustomobject]@{ Seconds = ([int64]$fields[1] - [int64]$fields[0]) / 1000; Output = $fields[3] }
          }
          Write-Output 'Slowest finished steps:'
          $finished | Sort-Object Seconds -Descending | Select-Object -First 15 | Format-Table -AutoSize | Out-String -Width 300
          Write-Output 'Unfinished compiles:'
          Select-String -Path (Join-Path $directory 'build.ninja') -Pattern '^build ([^:$]+\.obj):' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Where-Object { $_ -notin $finished.Output }

      # --gpu also checks the GPU code path, which falls back to the CPU on
      # runners without a usable GPU
      - name: Test
        if: runner.os != 'Windows'
        run: python3 scripts/test-binaries.py --require-ffmpeg --gpu "bin/${{ matrix.platform }}"

      - name: Test
        if: runner.os == 'Windows'
        run: python scripts/test-binaries.py --require-ffmpeg --gpu "bin/${{ matrix.platform }}"

      - name: Package
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          XZ_OPT=-T0 tar -C bin -cJf "dist/$ARCHIVE.tar.xz" "${{ matrix.platform }}"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "bin\${{ matrix.platform }}" -DestinationPath "dist\$env:ARCHIVE.zip"

      # The same tools plus the WebGPU execution provider. Everything else is
      # already built, this only installs them again
      - name: Build GPU tools
        if: matrix.gpu && runner.os != 'Windows'
        run: scripts/build-binaries.sh --webgpu --output "bin-gpu/${{ matrix.platform }}"

      - name: Build GPU tools
        if: matrix.gpu && runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-binaries.ps1 -FFmpeg build/prefix-windows-x86_64 -WebGPU -Output "bin-gpu\${{ matrix.platform }}"

      - name: Test GPU tools
        if: matrix.gpu && runner.os != 'Windows'
        run: python3 scripts/test-binaries.py --require-ffmpeg --gpu "bin-gpu/${{ matrix.platform }}"

      - name: Test GPU tools
        if: matrix.gpu && runner.os == 'Windows'
        run: python scripts/test-binaries.py --require-ffmpeg --gpu "bin-gpu/${{ matrix.platform }}"

      - name: Package GPU tools
        if: matrix.gpu && runner.os != 'Windows'
        run: XZ_OPT=-T0 tar -C bin-gpu -cJf "dist/$ARCHIVE-gpu.tar.xz" "${{ matrix.platform }}"

      - name: Package GPU tools
        if: matrix.gpu && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "bin-gpu\${{ matrix.platform }}" -DestinationPath "dist\$env:ARCHIVE-gpu.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tools-${{ inputs.release }}
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: abng-tools-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum abng-tools-* | tee SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/abng-tools-*

      - name: Publish
        env:
          RELEASE: ${{ needs.prepare.outputs.label }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Analysis tools release $RELEASE, built from $GITHUB_SHA.

          The \`-gpu\` archives also include the WebGPU execution provider, which runs the MusicNN models on the GPU (Vulkan on Linux, Direct3D 12 on Windows). On macOS the regular archives use the GPU through CoreML.

          The easiest way to install them is the "Install tools" button in the plugin options. To install them manually, extract the archive for your platform into the plugin's \`bin/\` directory, e.g.

          \`\`\`sh
          tar -xJf abng-tools-$RELEASE-linux-x86_64.tar.xz -C ~/.local/share/MusicBrainz/Picard/plugins3/acousticbrainz_ng_*/bin
          \`\`\`

          \`picard-cli plugins info AcousticBrainz-ng\` shows where the plugin is installed. Check the downloads with \`sha256sum -c SHA256SUMS\` or \`gh attestation verify <file> -R $GH_REPO\`.

          The Linux builds need glibc 2.28 or newer, the macOS builds macOS 14 or newer on Apple Silicon and 13.4 or newer on Intel Macs. The Windows builds also run on Windows on ARM.
          EOF
          gh release create "tools-$RELEASE" dist/* \
            --target "$GITHUB_SHA" \
            --title "Analysis tools $RELEASE" \
            --notes-file notes.md \
            --latest=false
